name: 🏭 Release Pocket ID Sync

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"     # Pattern for standard: v1.2.3
      - "v[0-9]*.[0-9]*.[0-9]*-*"   # Pattern for pre-release: v1.2.3-alpha.1

env:
  PROJECT_PATH: "PocketIdSync/PocketIdSync.csproj"
  APP_NAME: "PocketIdSync"
  DOTNET_VERSION: "10.x"

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.SemVer }}
      isPrerelease: ${{ contains(steps.meta.outputs.PreReleaseLabelWithDash, '-') }}
    strategy:
      matrix:
        rid:
          - win-x64
          - linux-x64
          - osx-x64
          - osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0

      - name: Determine Version
        id: meta
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
          -c Release \
          -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o ./publish/${{ matrix.rid }}

      - name: Prepare Binary
        shell: bash
        run: |
          # 1. Determine the source binary name (based on project filename usually)
          # Assuming the binary name matches the project filename without extension.
          # If your csproj is "MyTool.csproj", dotnet produces "MyTool" or "MyTool.exe"
          PROJECT_FILENAME=$(basename "${{ env.PROJECT_PATH }}" .csproj)

          # 2. Determine extensions
          # Windows gets .exe, others get nothing
          if [[ "${{ matrix.rid }}" == win* ]]; then
            SRC_EXT=".exe"
            DEST_EXT=".exe"
          else
            SRC_EXT=""
            DEST_EXT=""
          fi

          # 3. Construct source and destination paths
          SRC_FILE="./publish/${{ matrix.rid }}/$PROJECT_FILENAME$SRC_EXT"

          # New Name: MyApp-linux-x64
          DEST_NAME="${{ env.APP_NAME }}-${{ matrix.rid }}$DEST_EXT"

          echo "Moving $SRC_FILE to $DEST_NAME"
          mv "$SRC_FILE" "$DEST_NAME"

          # 4. Generate Checksum
          # shasum is available on ubuntu runners. We use -b for binary mode.
          # We output to a file named [BinaryName].sha256

          sha256sum -b "$DEST_NAME" > "$DEST_NAME.sha256"

          # 5. Save the new filename to ENV for the upload step
          echo "ARTIFACT_BINARY=$DEST_NAME" >> $GITHUB_ENV
          echo "ARTIFACT_HASH=$DEST_NAME.sha256" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.rid }}
          path: |
            ${{ env.ARTIFACT_BINARY }}
            ${{ env.ARTIFACT_HASH }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'  # currently only release on tag
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || needs.build.outputs.version }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || needs.build.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.build.outputs.isPrerelease == 'true' }}
